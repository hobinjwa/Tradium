<!DOCTYPE html>
<html>
<head>
    <title>주식 시뮬레이터 - 메인</title>
</head>
<body>
    <h1>안녕하세요, {{ user.username }}님</h1>
    <p>현재 잔고: ₩{{ balance }}</p>

    <h2>주식 목록</h2>
    <ul>
        {% for stock in stocks %}
        <li>
            <a href="{% url 'stock_main' stock.id %}">
                {{ stock.name }} - 현재가 ₩{{ stock.price }}
            </a>
        </li>
        {% empty %}
        <li>등록된 주식이 없습니다.</li>
        {% endfor %}
    </ul>
</body>
</html>
