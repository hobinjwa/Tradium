{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>사용자 랭킹</title>
    <link rel="stylesheet" href="{% static 'simulator/css/ranking.css' %}">
</head>
<body>
    <div style="margin: 15px 0;">
        <a href="{% url 'main' %}" style="color: #4a90e2; font-weight: bold;">🏠 메인으로</a>
    </div>
    <h1>📈 사용자 랭킹</h1>

    <table>
        <thead>
            <tr>
                <th>순위</th>
                <th>유저명</th>
                <th>총 자산</th>
            </tr>
        </thead>
        <tbody>
            {% for i in ranking %}
            <tr>
                <td>{{ forloop.counter }}</td>
                <td>
                    <a href="{% url 'portfolio' i.user.id %}">
                        {{ i.user.username }}
                    </a>
                </td>
                <td>
                    <span class="tooltip" data-tooltip="잔고: {{ i.balance|floatformat:2 }}₩, 주식: {{ i.stock_value|floatformat:2 }}₩">
                        {{ i.total_balance|floatformat:2 }}₩
                    </span>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <p style="margin-top: 40px;"
